{% extends 'base.html' %}{% block title %}{{ prancha.titulo }}{% endblock %}{% block content %}<section class="section"><div class="container text-center"><h1>{{ prancha.titulo }}</h1><p>{{ prancha.descricao }}</p><div class="ctea-act-grid">{% for item in itens %}<button type="button" class="ctea-act-card" onclick="falar('{{ item.pictograma.palavra|escapejs }}')" aria-label="{{ item.pictograma.alt_text }}">{% if item.pictograma.imagem %}<img src="{{ item.pictograma.imagem.url }}" alt="" style="height:120px;max-width:100%;object-fit:contain">{% else %}<div class="act-icon" aria-hidden="true">{{ item.pictograma.icone_emoji|default:'🖼️' }}</div>{% endif %}<strong>{{ item.pictograma.palavra }}</strong></button>{% empty %}<p>Esta prancha ainda não tem cartões.</p>{% endfor %}</div><p id="mensagem" class="h3 mt-4" aria-live="polite"></p><a class="btn btn-outline-secondary mt-3" href="{% url 'usuarios:inicio' %}">Início</a></div></section>{% endblock %}{% block extra_js %}<script>function falar(texto){document.getElementById('mensagem').textContent=texto;if(window.falarTexto)window.falarTexto(texto);}</script>{% endblock %}
