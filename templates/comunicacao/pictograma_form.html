{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}<section class="section"><div class="container" style="max-width:760px"><h1>{{ titulo }}</h1><p class="section-sub">Use imagens próprias ou recursos com licença adequada e revise o significado antes de disponibilizar.</p><form method="post" enctype="multipart/form-data" class="ctea-card p-4">{% csrf_token %}{{ form.as_p }}<button class="btn-ctea btn-ctea-primary" type="submit">Salvar pictograma</button> <a class="btn btn-outline-secondary" href="{% url 'comunicacao:biblioteca' %}">Cancelar</a></form></div></section>{% endblock %}
